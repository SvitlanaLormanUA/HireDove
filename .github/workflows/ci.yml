# Runs on every push and PR. Render waits for these checks before deploying main
# (autoDeployTrigger: checksPass in render.yaml); Vercel's own build runs the TS type check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres, same major version as Neon, to make sure migrations apply.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hiredove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as Render
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Apply migrations to Postgres
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hiredove
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Check models and migrations are in sync
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hiredove
        run: alembic check

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
